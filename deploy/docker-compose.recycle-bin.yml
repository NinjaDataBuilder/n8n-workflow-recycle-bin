# Deprecated compatibility filename.
# Use docker-compose.sidecar.yml for new installations.
# This file intentionally contains the same isolated sidecar contract and never
# modifies or recreates the parent n8n Compose project.
services:
  workflow-recycle-bin:
    image: ${RECYCLE_BIN_IMAGE:?Set RECYCLE_BIN_IMAGE}
    restart: unless-stopped
    environment:
      PORT: "3000"
      RECYCLE_BIN_AUDIT_STORE_PATH: /data/audit.json
      N8N_INTERNAL_URL: ${N8N_INTERNAL_URL:?Set N8N_INTERNAL_URL}
      N8N_RECYCLE_BIN_HOOK_TOKEN_FILE: /run/secrets/recycle_bin_hook_token
    volumes:
      - recycle_bin_data:/data
    secrets:
      - recycle_bin_hook_token
    networks:
      - n8n-backend

secrets:
  recycle_bin_hook_token:
    file: ${RECYCLE_BIN_HOOK_TOKEN_FILE:?Set a local secret-file path}

volumes:
  recycle_bin_data:
    name: ${RECYCLE_BIN_VOLUME_NAME:-workflow-recycle-bin-data}

networks:
  n8n-backend:
    external: true
    name: ${DATABUILDER_NETWORK:?Set the existing n8n Docker network name}
